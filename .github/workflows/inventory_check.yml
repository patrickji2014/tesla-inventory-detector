name: 24/7 Tesla Inventory Background Monitor

on:
  schedule:
    # Run every 10 minutes continuously
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'data/targets.json'

permissions:
  contents: write

concurrency:
  group: 'tesla-inventory-monitor'
  cancel-in-progress: true

jobs:
  check-inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Run Background Inventory Scanner
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          node scripts/check_inventory_ci.js

      - name: Commit and Push Updated Snapshot
        run: |
          git config --global user.name "Tesla Watch Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add data/inventory_snapshot.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update inventory snapshot [skip ci]" && git push origin main)
